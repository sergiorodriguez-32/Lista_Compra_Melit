<div class="password-page">
  <div class="password-overlay">
    <div class="password-wrapper">
      <div class="page-title-block">
        <h1>Cambiar contraseña</h1>
        <p>Actualiza tu contraseña para mantener tu cuenta segura.</p>
      </div>

      <div class="password-card">
        @if (success()) {
          <div class="alert alert-success password-alert">La contraseña se ha actualizado correctamente.</div>
        }

        @if (error()) {
          <div class="alert alert-danger password-alert">No se ha podido cambiar la contraseña.</div>
        }

        @if (doNotMatch()) {
          <div class="alert alert-danger password-alert">La nueva contraseña y la confirmación no coinciden.</div>
        }

        <form (ngSubmit)="changePassword()" [formGroup]="passwordForm">
          <div class="password-form-grid">
            <div class="mb-3 password-full-width">
              <label class="form-label" for="currentPassword">Contraseña actual</label>
              <input
                id="currentPassword"
                type="password"
                class="form-control custom-input"
                formControlName="currentPassword"
                placeholder="Introduce tu contraseña actual"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="newPassword">Nueva contraseña</label>
              <input
                id="newPassword"
                type="password"
                class="form-control custom-input"
                formControlName="newPassword"
                placeholder="Introduce la nueva contraseña"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="confirmPassword">Confirmar contraseña</label>
              <input
                id="confirmPassword"
                type="password"
                class="form-control custom-input"
                formControlName="confirmPassword"
                placeholder="Repite la nueva contraseña"
              />
            </div>
          </div>

          <div class="mb-3">
            <jhi-password-strength-bar [passwordToCheck]="passwordForm.get('newPassword')?.value ?? ''"></jhi-password-strength-bar>
          </div>

          <div class="password-actions">
            <button type="submit" class="btn btn-primary">Guardar contraseña</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
