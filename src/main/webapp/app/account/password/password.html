<div class="password-page">
  <div class="password-overlay">
    <div class="password-wrapper">
      <div class="page-header-row">
        <div class="page-title-block">
          <h1>{{ 'password.title' | translate }}</h1>
          <p>{{ 'password.subtitle' | translate }}</p>
        </div>

        <div class="language-switch">
          <button type="button" class="btn btn-light btn-sm me-2" [class.active-lang]="idiomaActual === 'es'" (click)="cambiarIdioma('es')">
            ES
          </button>
          <button type="button" class="btn btn-light btn-sm" [class.active-lang]="idiomaActual === 'en'" (click)="cambiarIdioma('en')">
            EN
          </button>
        </div>
      </div>

      <div class="password-card">
        @if (success()) {
          <div class="alert alert-success password-alert">
            {{ 'password.messages.success' | translate }}
          </div>
        }

        @if (error()) {
          <div class="alert alert-danger password-alert">
            {{ 'password.messages.error' | translate }}
          </div>
        }

        @if (doNotMatch()) {
          <div class="alert alert-danger password-alert">
            {{ 'password.messages.doNotMatch' | translate }}
          </div>
        }

        <form (ngSubmit)="changePassword()" [formGroup]="passwordForm">
          <div class="password-form-grid">
            <div class="mb-3 password-full-width">
              <label class="form-label" for="currentPassword">{{ 'password.form.currentPassword' | translate }}</label>
              <input
                id="currentPassword"
                type="password"
                class="form-control custom-input"
                formControlName="currentPassword"
                [placeholder]="'password.placeholders.currentPassword' | translate"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="newPassword">{{ 'password.form.newPassword' | translate }}</label>
              <input
                id="newPassword"
                type="password"
                class="form-control custom-input"
                formControlName="newPassword"
                [placeholder]="'password.placeholders.newPassword' | translate"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="confirmPassword">{{ 'password.form.confirmPassword' | translate }}</label>
              <input
                id="confirmPassword"
                type="password"
                class="form-control custom-input"
                formControlName="confirmPassword"
                [placeholder]="'password.placeholders.confirmPassword' | translate"
              />
            </div>
          </div>

          <div class="mb-3">
            <jhi-password-strength-bar [passwordToCheck]="passwordForm.get('newPassword')?.value ?? ''"></jhi-password-strength-bar>
          </div>

          <div class="password-actions">
            <button type="submit" class="btn btn-primary">
              {{ 'password.actions.save' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
