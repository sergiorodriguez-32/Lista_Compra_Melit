<div class="login-page">
  <div class="login-overlay">
    <div class="login-card centered-login-card">
      <h2 data-cy="loginTitle">Iniciar sesión</h2>
      <p class="login-subtitle">Accede a tu cuenta para continuar.</p>

      @if (authenticationError()) {
        <div class="alert alert-danger login-alert" data-cy="loginError">
          <strong>Inicio de sesión fallido.</strong> Revisa el usuario y la contraseña.
        </div>
      }

      <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input
            type="text"
            class="form-control login-input"
            name="username"
            id="username"
            placeholder="Introduce tu usuario"
            formControlName="username"
            data-cy="username"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Contraseña</label>
          <input
            type="password"
            class="form-control login-input"
            name="password"
            id="password"
            placeholder="Introduce tu contraseña"
            formControlName="password"
            data-cy="password"
          />
        </div>

        <div class="form-check login-check">
          <label class="form-check-label" for="rememberMe">
            <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
            <span>Recordarme</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary login-btn" data-cy="submit">Iniciar sesión</button>
      </form>

      <div class="login-links">
        <a class="login-link" routerLink="/account/reset/request">¿Has olvidado tu contraseña?</a>
      </div>

      <div class="register-box">
        <span>¿Aún no tienes una cuenta?</span>
        <a class="register-link" routerLink="/account/register">Crear cuenta</a>
      </div>
    </div>
  </div>
</div>
