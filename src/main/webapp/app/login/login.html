<div class="login-page">
  <div class="login-overlay">
    <div class="login-card centered-login-card">
      <div class="login-top-bar">
        <div></div>

        <div class="language-switch">
          <button type="button" class="btn btn-light btn-sm me-2" [class.active-lang]="idiomaActual === 'es'" (click)="cambiarIdioma('es')">
            ES
          </button>
          <button type="button" class="btn btn-light btn-sm" [class.active-lang]="idiomaActual === 'en'" (click)="cambiarIdioma('en')">
            EN
          </button>
        </div>
      </div>

      <h2 data-cy="loginTitle">{{ 'login.title' | translate }}</h2>
      <p class="login-subtitle">{{ 'login.subtitle' | translate }}</p>

      @if (authenticationError()) {
        <div class="alert alert-danger login-alert" data-cy="loginError">
          {{ 'login.messages.error' | translate }}
        </div>
      }

      <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="mb-3">
          <label class="form-label" for="username">{{ 'login.form.username' | translate }}</label>
          <input
            #username
            type="text"
            class="form-control login-input"
            name="username"
            id="username"
            [placeholder]="'login.placeholders.username' | translate"
            formControlName="username"
            data-cy="username"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">{{ 'login.form.password' | translate }}</label>
          <input
            type="password"
            class="form-control login-input"
            name="password"
            id="password"
            [placeholder]="'login.placeholders.password' | translate"
            formControlName="password"
            data-cy="password"
          />
        </div>

        <div class="form-check login-check">
          <label class="form-check-label" for="rememberMe">
            <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
            <span>{{ 'login.form.rememberMe' | translate }}</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary login-btn" data-cy="submit">
          {{ 'login.actions.submit' | translate }}
        </button>
      </form>

      <div class="login-links">
        <a class="login-link" routerLink="/account/reset/request">
          {{ 'login.actions.forgotPassword' | translate }}
        </a>
      </div>

      <div class="register-box">
        <span>{{ 'login.registerBox.text' | translate }}</span>
        <a class="register-link" routerLink="/account/register">
          {{ 'login.registerBox.link' | translate }}
        </a>
      </div>
    </div>
  </div>
</div>
